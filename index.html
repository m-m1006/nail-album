<script>

/* =====================================================
   招待コード
===================================================== */

async function createInviteCode(){

  try{

    if(!currentStaff){
      await loadCurrentStaff();
    }
    
    console.log("現在のスタッフ:", currentStaff);

    if(!currentStaff){
      alert("スタッフ情報を取得できませんでした");
      return;
    }

    if(currentStaff.role !== "owner"){
      alert("招待コードを発行できるのはオーナーのみです");
      return;
    }

    // 6桁のランダムコード
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    const random = new Uint32Array(6);
    crypto.getRandomValues(random);

    let code = "";

    for(let i = 0; i < 6; i++){
      code += chars[random[i] % chars.length];
    }

    // 7日間有効
    const expiresAt = new Date(
      Date.now() + 7 * 24 * 60 * 60 * 1000
    ).toISOString();

    const { data, error } = await supabaseClient
      .from("store_invites")
      .insert({
        store_id: currentStaff.store_id,
        invite_code: code,
        expires_at: expiresAt
      })
      .select()
      .single();

    if(error){
  console.error(error);
  alert("エラー：" + error.message);
  return;
}

    document.getElementById("inviteCode").textContent =
      data.invite_code;

    document.getElementById("inviteExpires").textContent =
      "有効期限：" +
      new Date(data.expires_at).toLocaleDateString("ja-JP");

    document.getElementById("inviteCodeArea").style.display = "block";

  }catch(e){

    console.error("招待コード発行エラー:", e);
    alert("招待コードを発行できませんでした");

  }

}

/* =====================================================
   基本設定
===================================================== */

const DB_NAME = "NailAlbumDB";
const DB_VERSION = 1;
const STORE = "samples";

let categories = JSON.parse(
  localStorage.getItem("nail_categories") ||
  JSON.stringify([
    {id:1,name:"シンプル"},
    {id:2,name:"こだわり"},
    {id:3,name:"フルオーダー"}
  ])
);

/* =====================================================
   スタッフ
===================================================== */

let staffs = [];


/* Supabaseから同じ店舗のスタッフを取得 */
async function loadStaffs(){

  if(!currentStaff){
    console.log("現在のスタッフ情報がありません");
    staffs = [];
    return [];
  }

  const { data, error } = await supabaseClient
    .from("staff")
    .select("id, name, role, user_id")
    .eq("store_id", currentStaff.store_id)
    .order("id", { ascending:true });

  if(error){

    console.error(
      "スタッフ取得エラー:",
      error
    );

    staffs = [];
    return [];

  }

  staffs = data || [];

  console.log(
    "店舗スタッフ:",
    staffs
  );

  return staffs;

}


/* スタッフIDから名前を取得 */
function staffName(id){

  const s =
    staffs.find(
      x => x.id == id
    );

  return s
    ? s.name
    : "不明";

}


/* スタッフ管理を開く */
async function openStaffManager(){

  await loadStaffs();

  renderStaffManager();

  $("staffManager")
    .classList
    .add("open");

}


/* スタッフ一覧を表示 */
function renderStaffManager(){

  $("staffList").innerHTML =

    staffs.length

      ? staffs.map(s => `

        <div class="staff-row">

          <input
            value="${esc(s.name)}"
            onchange="renameStaff(${s.id},this.value)"
          >

          <button
            onclick="
              renameStaff(
                ${s.id},
                this.previousElementSibling.value
              )
            "
          >
            保存
          </button>

          ${
            s.role === "owner"

              ? `
                <span
                  class="small"
                  style="white-space:nowrap;"
                >
                  管理者
                </span>
              `

              : `
                <button
                  class="delete-staff"
                  onclick="removeStaff(${s.id})"
                >
                  削除
                </button>
              `
          }

        </div>

      `).join("")

      : `
        <div class="empty">
          スタッフがいません
        </div>
      `;

}


/* スタッフ名変更 */
async function renameStaff(id,name){

  name = name.trim();

  if(!name){

    alert("スタッフ名を入力してね");

    await loadStaffs();

    renderStaffManager();

    return;

  }

  const duplicate =
    staffs.some(
      s =>
        s.id != id &&
        s.name === name
    );

  if(duplicate){

    alert("同じ名前のスタッフがいます");

    return;

  }

  const { error } = await supabaseClient
    .from("staff")
    .update({
      name:name
    })
    .eq("id",id)
    .eq("store_id",currentStaff.store_id);

  if(error){

    console.error(
      "スタッフ名変更エラー:",
      error
    );

    alert("スタッフ名を変更できませんでした");

    return;

  }

  await loadStaffs();

  renderStaffManager();

}


/* スタッフ削除 */
async function removeStaff(id){

  const s =
    staffs.find(
      x => x.id == id
    );

  if(!s) return;

  if(s.role === "owner"){

    alert("管理者は削除できません");

    return;

  }

  if(
    !confirm(
      `「${s.name}」を削除する？`
    )
  ) return;


  const { error } = await supabaseClient
    .from("staff")
    .delete()
    .eq("id",id)
    .eq("store_id",currentStaff.store_id);

  if(error){

    console.error(
      "スタッフ削除エラー:",
      error
    );

    alert(
      "スタッフを削除できませんでした"
    );

    return;

  }

  await loadStaffs();

  renderStaffManager();

}

/* =====================================================
   店舗設定
===================================================== */

async function loadStoreName(){

  if(!currentStaff){
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("store")
      .select("id, name")
      .eq("id", currentStaff.store_id)
      .single();

  if(error){

    console.error(
      "店舗情報取得エラー:",
      error
    );

    return;
  }

  const storeName =
    data?.name || "店舗名未設定";

  $("storeNameDisplay").textContent =
    storeName;

  $("storeNameInput").value =
    storeName;
}


/* 店舗設定を開く */
async function openStoreSettings(){

  if(!currentStaff){
    await loadCurrentStaff();
  }

  if(!currentStaff){
    alert("スタッフ情報を取得できませんでした");
    return;
  }

  if(currentStaff.role !== "owner"){

    alert(
      "店舗設定を変更できるのはオーナーのみです"
    );

    return;
  }

  await loadStoreName();

  $("storeSettingMessage").textContent = "";

  $("storeSettings")
    .classList
    .add("open");
}


/* 店舗名を保存 */
async function saveStoreName(){

  if(!currentStaff){
    alert("スタッフ情報を取得できませんでした");
    return;
  }

  if(currentStaff.role !== "owner"){

    alert(
      "店舗名を変更できるのはオーナーのみです"
    );

    return;
  }

  const name =
    $("storeNameInput")
      .value
      .trim();

  if(!name){

    $("storeSettingMessage").textContent =
      "店舗名を入力してください";

    return;

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded =
      function(e){

        const database =
          e.target.result;

        if(
          !database.objectStoreNames.contains(STORE)
        ){

          const store =
            database.createObjectStore(
              STORE,
              {keyPath:"id"}
            );

          store.createIndex(
            "category",
            "c",
            {unique:false}
          );

          store.createIndex(
            "time",
            "t",
            {unique:false}
          );

        }

      };


    request.onsuccess =
      function(e){

        db=e.target.result;

        resolve(db);

      };


    request.onerror =
      function(){

        reject(request.error);

      };

  });

}

function putSample(sample){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

    tx.objectStore(STORE).put(sample);

    tx.oncomplete=()=>{

      resolve();

    };

    tx.onerror=()=>{

      reject(tx.error);

    };

  });

}


function deleteSample(id){

  return new Promise((resolve,reject)=>{

    const tx =
      db.transaction(
        STORE,
        "readwrite"
      );

    tx.objectStore(STORE).delete(id);

    tx.oncomplete=()=>{

      resolve();

    };

    tx.onerror=()=>{

      reject(tx.error);

    };

  });

}

async function migrateOldData(){

  try{

    const old =
      JSON.parse(
        localStorage.getItem("na") || "[]"
      );

    if(!old.length) return;

    const migrated =
      localStorage.getItem(
        "nail_migrated"
      );

    if(migrated==="yes") return;

    for(const s of old){

      const sample={

        id:s.id,

        c:s.c,

        name:s.name,

        d:s.d
          ? dataURLtoBlob(s.d)
          : null,

        m:s.m
          ? dataURLtoBlob(s.m)
          : null,

        ms:s.ms || "",

        mm:s.mm || "",

        staff:s.staff || "自分",

        date:
          s.date ||
          new Date()
            .toLocaleDateString("ja-JP"),

        t:
          s.t ||
          Date.now()

      };

      await putSample(sample);

    }

    localStorage.setItem(
      "nail_migrated",
      "yes"
    );

  }catch(e){

    console.log(
      "旧データ移行エラー",
      e
    );

  }

}


function dataURLtoBlob(dataURL){

  const parts =
    dataURL.split(",");

  const mime =
    parts[0]
      .match(/:(.*?);/)[1];

  const binary =
    atob(parts[1]);

  const arr =
    new Uint8Array(
      binary.length
    );

  for(
    let i=0;
    i<binary.length;
    i++
  ){

    arr[i] =
      binary.charCodeAt(i);

  }

  return new Blob(
    [arr],
    {type:mime}
  );

}

    input.value.trim();

    );

    categories.some(
      c=>c.name===name
    )
  ){

    alert(

    );

    return;

  }

  const id =
    categories.length
      ? Math.max(
          ...categories.map(c=>c.id)
        )+1

  categories.push({

async function removeCategory(id){

  const count =
    S.filter(
      s=>s.c==id

  if(count>0){

    alert(
      "このカテゴリーにはサンプルが入っているため削除できません。\n先にサンプルを削除してください。"
    );

    return;

  }

  if(categories.length<=1){

    alert(
      "カテゴリーは最低1つ必要です"
    );

    return;

  }

  const c =
    categories.find(
      x=>x.id===id

      `「${c.name}」を削除する？`

  ) return;

  categories =
    categories.filter(
      x=>x.id!==id
    );

  saveCategories();

  if(co===id){

  }

  renderCategoryManager();

  home();

async function del(){
  if(!confirm("このサンプルを削除する？")) return;

  try{
    if(!currentStaff){
      await loadCurrentStaff();
    }

    if(!currentStaff){
      throw new Error("ログイン中のスタッフ情報がありません");
    }

    // 削除するサンプルの画像パスを取得
    const { data: row, error: fetchError } = await supabaseClient
      .from("design_sample")
      .select("id, design_image, product_image")
      .eq("id", cur)
      .eq("store_id", currentStaff.store_id)
      .single();

    if(fetchError) throw fetchError;

    // まずデータベースから削除
    const { error: deleteError } = await supabaseClient
      .from("design_sample")
      .delete()
      .eq("id", cur)
      .eq("store_id", currentStaff.store_id);

    if(deleteError) throw deleteError;

    // Storageの画像も削除
    const paths = [];

    if(row.design_image) paths.push(row.design_image);
    if(row.product_image) paths.push(row.product_image);

    if(paths.length){
      const { error: storageError } = await supabaseClient
        .storage
        .from("nail-image")
        .remove(paths);

      if(storageError) {
        console.error("画像削除エラー:", storageError);
      }
    }

    S = S.filter(x => x.id != cur);
    list(co);

  }catch(e){
    console.error("削除エラー:", e);
    alert("削除できませんでした");
  }
}

===================================================== */

const loginScreen =
  document.getElementById("loginScreen");

const appScreen =
  document.querySelector(".app");

const loginButton =
  document.getElementById("loginButton");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const loginMessage =
  document.getElementById("loginMessage");


/* -------------------------
   画面切り替え
------------------------- */

function showApp(){

  loginScreen.style.display = "none";
  appScreen.style.display = "";

}


function showLogin(){

  loginScreen.style.display = "block";

  const signupScreen =
    document.getElementById("signupScreen");

  signupScreen.style.display = "none";

  appScreen.style.display = "none";

}

function showSignup(){

  loginScreen.style.display = "none";

  const signupScreen =
    document.getElementById("signupScreen");

  signupScreen.style.display = "block";

}

function showJoinStore(){

  loginScreen.style.display = "none";

  const signupScreen =
    document.getElementById("signupScreen");

  signupScreen.style.display = "none";

  const joinStoreScreen =
    document.getElementById("joinStoreScreen");

  joinStoreScreen.style.display = "block";

}

async function joinStore(){

  const name =
    document.getElementById("joinName").value.trim();

  const inviteCode =
    document.getElementById("joinInvite").value.trim().toUpperCase();

  const message =
    document.getElementById("joinMessage");

  if(!name || !inviteCode){

    message.textContent =
      "スタッフ名と招待コードを入力してください";

    return;
  }

  message.textContent =
    "店舗に参加しています…";

  try{

    const {
      data: staff,
      error
    } = await supabaseClient.rpc(
      "join_store_by_invite",
      {
        p_invite_code: inviteCode,
        p_name: name
      }
    );

    if(error){

      console.error(
        "店舗参加エラー:",
        error
      );

      message.textContent =
        "店舗に参加できませんでした：" +
        error.message;

      return;
    }

    if(!staff){

      message.textContent =
        "スタッフ登録を確認できませんでした";

      return;
    }

    message.textContent =
      "店舗への参加が完了しました！";

    currentStaff = staff;

    setTimeout(async () => {

      await reload();

      home();

      showApp();

    }, 500);

  }catch(e){

    console.error(
      "店舗参加エラー:",
      e
    );

    message.textContent =
      "店舗参加中にエラーが発生しました";

  }

}

async function signupStaff(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const inviteCode =
    document.getElementById("signupInvite").value.trim().toUpperCase();

  const message =
    document.getElementById("signupMessage");

  if(!name || !email || !password || !inviteCode){
    message.textContent =
      "すべて入力してください";
    return;
  }

  if(password.length < 6){
    message.textContent =
      "パスワードは6文字以上にしてください";
    return;
  }

  message.textContent =
    "登録しています…";

  try{

    // Supabaseアカウント作成
    const {
      data,
      error
    } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if(error){
      console.error(error);
      message.textContent =
        "登録できませんでした：" + error.message;
      return;
    }

    // ログイン状態を取得
    const {
      data: sessionData
    } = await supabaseClient.auth.getSession();

    if(!sessionData.session){
      message.textContent =
        "登録しました。メールを確認してからログインしてください。";
      return;
    }

    // 招待コードから店舗スタッフ登録
    const {
      data: staff,
      error: joinError
    } = await supabaseClient.rpc(
      "join_store_by_invite",
      {
        p_invite_code: inviteCode,
        p_name: name
      }
    );

    if(joinError){
      console.error(joinError);
      message.textContent =
        "店舗登録に失敗しました：" +
        joinError.message;
      return;
    }

    message.textContent =
      "スタッフ登録が完了しました！";

    // 少し待ってログイン画面へ
    setTimeout(() => {
      showLogin();
      loginEmail.value = email;
      loginPassword.value = password;
    }, 1000);

  }catch(e){

    console.error(e);

    message.textContent =
      "登録中にエラーが発生しました";

  }

}

/* -------------------------
   ログイン中スタッフ取得
------------------------- */

async function loadCurrentStaff(){

  const {
    data: { user },
    error: userError
  } =
    await supabaseClient.auth.getUser();


  if(userError || !user){

    console.log(
      "ログインユーザーが見つかりません"
    );

    currentUser = null;
    currentStaff = null;

    return null;

  }


  currentUser = user;


  const {
    data: staff,
    error: staffError
  } =
    await supabaseClient
      .from("staff")
      .select(
        "id, name, store_id, role"
      )
      .eq(
        "user_id",
        user.id
      )
      .single();


  if(staffError || !staff){

    console.error(
      "スタッフ情報の取得に失敗:",
      staffError
    );

    currentStaff = null;

    return null;

  }


  currentStaff = staff;


  console.log(
    "ログインユーザー:",
    currentUser
  );

  console.log(
    "現在のスタッフ:",
    currentStaff
  );


  /* -------------------------
     ログイン情報表示
  ------------------------- */

  const oldLoginInfo =
    document.getElementById(
      "loginInfo"
    );

  if(oldLoginInfo){

    oldLoginInfo.remove();

  }


  const loginInfo =
    document.createElement("div");

  loginInfo.id =
    "loginInfo";

  loginInfo.style.cssText = `
    padding:10px 16px;
    font-size:12px;
    color:#777;
    text-align:right;
    background:#fff;
  `;

  loginInfo.innerHTML = `
    👤 ${esc(currentStaff.name)}
    ・店舗ID ${currentStaff.store_id}
  `;

  appScreen.prepend(
    loginInfo
  );


  return currentStaff;

}


/* -------------------------
   アプリ起動
------------------------- */

async function startApp(){

  try{

    await openDB();

    const staff =
      await loadCurrentStaff();

    if(!staff){

      showJoinStore();

      return;

    }

    await loadStoreName();

    await reload();

    home();

    showApp();

  }catch(e){

    console.error(
      "アプリ起動エラー:",
      e
    );

    alert(
      "アプリの読み込みに失敗しました。ページを更新してみてね。"
    );

  }

}


/* -------------------------
   ログイン確認
------------------------- */

async function checkLogin(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if(error){

      console.error(
        "ログイン確認エラー:",
        error
      );

      showLogin();

      return;

    }


    if(data.session){

      await startApp();

    }else{

      showLogin();

    }


  }catch(e){

    console.error(
      "ログイン確認エラー:",
      e
    );

    showLogin();

  }

}


/* -------------------------
   ログインボタン
------------------------- */

loginButton.addEventListener(
  "click",
  async function(){

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;


    if(!email || !password){

      loginMessage.textContent =
        "メールアドレスとパスワードを入力してください";

      return;

    }


    loginMessage.textContent =
      "ログイン中…";

    loginButton.disabled = true;


    try{

      const {
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email: email,
            password: password

          });


      if(error){

        console.error(
          "ログインエラー:",
          error
        );

        loginMessage.textContent =
          "ログインできませんでした";

        loginButton.disabled =
          false;

        return;

      }


      loginMessage.textContent =
        "ログインしました！";


      await startApp();


    }catch(e){

      console.error(
        "ログインエラー:",
        e
      );

      loginMessage.textContent =
        "ログインできませんでした";

    }


    loginButton.disabled =
      false;

  }
);
