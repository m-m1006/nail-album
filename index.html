<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nail Album</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f3f2;
  color:#302b2a;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif
}
.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff
}
header{
  padding:18px 16px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:5
}
main{padding:16px}
h2{font-size:21px}
button{font:inherit;cursor:pointer}
.top,.head{
  display:flex;
  justify-content:space-between;
  align-items:center
}
.plus{
  border:0;
  border-radius:50%;
  width:44px;
  height:44px;
  background:#302b2a;
  color:#fff;
  font-size:25px
}
.more,.back,.secondary{
  border:0;
  border-radius:10px;
  padding:10px;
  background:#eee9e7;
  color:#554f4c;
  font-weight:bold
}
.course{margin-bottom:28px}
.scroll{
  display:flex;
  gap:4px;
  overflow:auto
}
.thumb{
  width:112px;
  min-width:112px;
  height:112px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer
}
.thumb img,.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px
}
.grid .thumb{
  width:auto;
  min-width:0;
  height:calc((100vw - 38px)/3);
  max-height:165px
}
.photo{
  width:100%;
  aspect-ratio:1;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:12px
}
.title{
  font-size:22px;
  font-weight:bold;
  margin:14px 0
}
.info{
  border-top:1px solid #eee;
  padding:14px 0
}
.label{
  font-size:12px;
  color:#999;
  font-weight:bold;
  margin-bottom:6px
}
.memo{
  white-space:pre-wrap;
  line-height:1.6
}
.meta{
  font-size:12px;
  color:#999;
  margin-top:10px
}
.actions,.row{
  display:flex;
  gap:8px;
  margin-top:14px
}
.actions>* ,.row>*{flex:1}
.primary{
  border:0;
  border-radius:10px;
  padding:12px;
  background:#302b2a;
  color:#fff;
  font-weight:bold
}
.danger{
  border:0;
  border-radius:10px;
  padding:12px;
  background:#f8e5e5;
  color:#a33;
  font-weight:bold
}
.screen{display:none}
.active{display:block}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  align-items:flex-end;
  z-index:20
}
.modal.open{display:flex}
.sheet{
  background:#fff;
  width:min(520px,100%);
  margin:auto;
  padding:20px;
  border-radius:22px 22px 0 0;
  max-height:92vh;
  overflow:auto
}
.choice{
  display:block;
  width:100%;
  margin:7px 0;
  text-align:left
}
label{
  display:block;
  margin-top:13px;
  font-size:13px;
  font-weight:bold
}
input,textarea{
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px solid #ddd;
  border-radius:10px;
  font:inherit
}
textarea{min-height:100px}
.small{
  font-size:11px;
  color:#999
}
.empty{
  text-align:center;
  color:#999;
  padding:30px
}
.manage{
  margin-top:35px;
  border-top:1px solid #eee;
  padding-top:20px
}
.course-item{
  display:flex;
  align-items:center;
  gap:7px;
  margin:8px 0
}
.course-item span{
  flex:1;
  padding:12px;
  background:#f5f3f2;
  border-radius:10px
}
.icon-btn{
  border:0;
  background:#eee9e7;
  border-radius:9px;
  width:42px;
  height:42px
}
</style>
</head>

<body>

<div class="app">

<header>
  <b style="font-size:23px">💅 Nail Album</b>
  <div class="small">デザインサンプル共有</div>
</header>

<main>

<section id="home" class="screen active">

  <div class="top">
    <h2>サンプル</h2>
    <button class="plus" id="hp">＋</button>
  </div>

  <div id="rows"></div>

  <div class="manage">
    <div class="top">
      <h2>コース管理</h2>
      <button class="secondary" id="manageAdd">＋追加</button>
    </div>

    <div id="courseManage"></div>
  </div>

</section>


<section id="list" class="screen">

  <button class="back" id="bh">← ホーム</button>

  <div class="top">
    <h2 id="lt"></h2>
    <button class="plus" id="lp">＋</button>
  </div>

  <div id="grid" class="grid"></div>

</section>


<section id="detail" class="screen">

  <button class="back" id="bl">← 戻る</button>

  <div id="db"></div>

</section>

</main>


<!-- コース選択 -->

<div id="choose" class="modal">

  <div class="sheet">

    <h2>どのコースに追加する？</h2>

    <div id="choices"></div>

    <button
      class="secondary choice"
      onclick="closeM('choose')">
      キャンセル
    </button>

  </div>

</div>


<!-- サンプル登録 -->

<div id="form" class="modal">

  <div class="sheet">

    <h2 id="ft">サンプル登録</h2>

    <div class="small" id="fc"></div>

    <label>デザイン写真（1枚）</label>
    <input
      id="df"
      type="file"
      accept="image/*">

    <label>商材写真（1枚）</label>
    <input
      id="mf"
      type="file"
      accept="image/*">

    <label>サンプル名</label>
    <input id="sn">

    <label>使用商材</label>
    <textarea
      id="ms"
      placeholder="使った商材をまとめて入力">
    </textarea>

    <label>メモ</label>
    <textarea
      id="mm"
      placeholder="使用量・塗り方・注意点など">
    </textarea>

    <div class="row">

      <button
        class="secondary"
        onclick="closeM('form')">
        キャンセル
      </button>

      <button
        class="primary"
        id="saveBtn"
        onclick="save()">
        保存
      </button>

    </div>

  </div>

</div>


<!-- コース追加・名前変更 -->

<div id="courseForm" class="modal">

  <div class="sheet">

    <h2 id="courseFormTitle">コース追加</h2>

    <label>コース名</label>

    <input
      id="courseName"
      placeholder="例：マグネット">

    <div class="row">

      <button
        class="secondary"
        onclick="closeM('courseForm')">
        キャンセル
      </button>

      <button
        class="primary"
        onclick="saveCourse()">
        保存
      </button>

    </div>

  </div>

</div>


<script>

const $=x=>document.getElementById(x);

let C=[];

let S=[];

let co=1;

let cur=0;

let edit=0;

let editingCourse=0;


/* =========================
   データ読み込み
========================= */

try{

  C=JSON.parse(
    localStorage.getItem("nailAlbumCourses")||""
  );

}catch(e){

  C=[];

}

try{

  S=JSON.parse(
    localStorage.getItem("na")||"[]"
  );

}catch(e){

  S=[];

}


/* 初回だけ3コース作成 */

if(!C.length){

  C=[
    {id:1,name:"シンプル"},
    {id:2,name:"こだわり"},
    {id:3,name:"フルオーダー"}
  ];

  saveCourses();

}


/* =========================
   保存
========================= */

function saveCourses(){

  localStorage.setItem(
    "nailAlbumCourses",
    JSON.stringify(C)
  );

}

function data(){

  localStorage.setItem(
    "na",
    JSON.stringify(S)
  );

}


/* =========================
   コース名
========================= */

function cn(id){

  const c=C.find(x=>x.id==id);

  return c ? c.name : "";

}


/* =========================
   HTMLエスケープ
========================= */

function esc(x){

  return String(x||"").replace(
    /[&<>"']/g,
    a=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[a])
  );

}


/* =========================
   画面移動
========================= */

function go(id){

  document
    .querySelectorAll(".screen")
    .forEach(x=>x.classList.remove("active"));

  $(id).classList.add("active");

  scrollTo(0,0);

}


/* =========================
   モーダル
========================= */

function closeM(id){

  $(id).classList.remove("open");

}


/* =========================
   サムネイル
========================= */

function th(s){

  return `
    <div
      class="thumb"
      onclick="detail(${s.id})">

      ${
        s.d
        ?
        `<img src="${s.d}">`
        :
        "📸"
      }

    </div>
  `;

}


/* =========================
   ホーム
========================= */

function home(){

  let html="";

  C.forEach(c=>{

    const a=S
      .filter(s=>s.c==c.id)
      .sort((x,y)=>y.t-x.t)
      .slice(0,5);

    html+=`

      <div class="course">

        <div class="head">

          <b>${esc(c.name)}</b>

          <button
            class="more"
            onclick="list(${c.id})">

            すべて見る →

          </button>

        </div>

        <div class="scroll">

          ${
            a.length
            ?
            a.map(th).join("")
            :
            `
            <div
              class="empty"
              style="width:100%">

              まだサンプルがありません

            </div>
            `
          }

        </div>

      </div>

    `;

  });

  $("rows").innerHTML=html;

  renderCourseManage();

}


/* =========================
   コース管理
========================= */

function renderCourseManage(){

  $("courseManage").innerHTML=C.map(c=>`

    <div class="course-item">

      <span>${esc(c.name)}</span>

      <button
        class="icon-btn"
        onclick="renameCourse(${c.id})">
        ✏️
      </button>

      <button
        class="icon-btn"
        onclick="deleteCourse(${c.id})">
        🗑️
      </button>

    </div>

  `).join("");

}


/* =========================
   コース追加
========================= */

function addCourse(){

  editingCourse=0;

  $("courseFormTitle").textContent="コース追加";

  $("courseName").value="";

  $("courseForm").classList.add("open");

}


/* =========================
   コース名変更
========================= */

function renameCourse(id){

  editingCourse=id;

  const c=C.find(x=>x.id==id);

  $("courseFormTitle").textContent="コース名を変更";

  $("courseName").value=c.name;

  $("courseForm").classList.add("open");

}


/* =========================
   コース保存
========================= */

function saveCourse(){

  const name=$("courseName").value.trim();

  if(!name){

    alert("コース名を入れてね");

    return;

  }


  if(editingCourse){

    const c=C.find(
      x=>x.id==editingCourse
    );

    c.name=name;

  }else{

    C.push({

      id:Date.now(),

      name:name

    });

  }


  saveCourses();

  closeM("courseForm");

  home();

}


/* =========================
   コース削除
========================= */

function deleteCourse(id){

  const c=C.find(x=>x.id==id);

  const count=S.filter(
    s=>s.c==id
  ).length;

  if(count){

    const ok=confirm(
      `「${c.name}」には${count}件のサンプルがあります。\n\nコースを削除すると、そのサンプルも削除されます。\n\n本当に削除する？`
    );

    if(!ok)return;

    S=S.filter(s=>s.c!=id);

    data();

  }else{

    if(!confirm(
      `「${c.name}」を削除する？`
    ))return;

  }


  C=C.filter(x=>x.id!=id);

  saveCourses();

  home();

}


/* =========================
   コース一覧
========================= */

function list(id){

  co=id;

  $("lt").textContent=cn(co);

  const a=S
    .filter(s=>s.c==co)
    .sort((x,y)=>y.t-x.t);

  $("grid").innerHTML=
    a.length
    ?
    a.map(th).join("")
    :
    `
      <div
        class="empty"
        style="grid-column:1/-1">

        まだサンプルがありません

      </div>
    `;

  go("list");

}


/* =========================
   ＋からコース選択
========================= */

function chooser(){

  if(!C.length){

    alert("先にコースを追加してね");

    return;

  }

  $("choices").innerHTML=C.map(c=>`

    <button
      class="secondary choice"
      onclick="pick(${c.id})">

      ${esc(c.name)}

    </button>

  `).join("");

  $("choose").classList.add("open");

}


function pick(id){

  co=id;

  closeM("choose");

  add();

}


/* =========================
   次の番号
========================= */

function nextNumber(){

  let max=0;

  S
    .filter(s=>s.c==co)
    .forEach(s=>{

      const m=
        String(s.name||"")
        .match(/(\d+)$/);

      if(m){

        max=Math.max(
          max,
          Number(m[1])
        );

      }

    });

  return max+1;

}


/* =========================
   サンプル追加画面
========================= */

function add(){

  edit=0;

  cur=0;

  $("ft").textContent="サンプル登録";

  $("fc").textContent="← "+cn(co);

  $("sn").value=
    cn(co)+nextNumber();

  $("ms").value="";

  $("mm").value="";

  $("df").value="";

  $("mf").value="";

  $("form").classList.add("open");

}


/* =========================
   写真読み込み
========================= */

function file(f){

  return new Promise(resolve=>{

    if(!f){

      resolve("");

      return;

    }

    const x=new FileReader();

    x.onload=()=>resolve(x.result);

    x.onerror=()=>resolve("");

    x.readAsDataURL(f);

  });

}


/* =========================
   サンプル保存
========================= */

async function save(){

  const button=$("saveBtn");

  button.disabled=true;

  button.textContent="保存中…";


  try{

    const name=
      $("sn").value.trim();

    if(!name){

      alert("サンプル名を入れてね");

      return;

    }


    const designFile=
      $("df").files[0];

    const materialFile=
      $("mf").files[0];


    if(!edit && !designFile){

      alert(
        "デザイン写真を1枚選んでね"
      );

      return;

    }


    const d=
      await file(designFile);

    const m=
      await file(materialFile);


    if(edit){

      const s=S.find(
        x=>x.id==cur
      );

      s.name=name;

      s.ms=$("ms").value;

      s.mm=$("mm").value;

      if(d)s.d=d;

      if(m)s.m=m;


    }else{

      S.push({

        id:Date.now(),

        c:co,

        name:name,

        d:d,

        m:m,

        ms:$("ms").value,

        mm:$("mm").value,

        staff:"自分",

        date:
          new Date()
          .toLocaleDateString("ja-JP"),

        t:Date.now()

      });

    }


    data();

    closeM("form");

    home();

    list(co);


  }catch(e){

    console.error(e);

    alert(
      "保存できませんでした。\nもう一度試してみてね。"
    );

  }finally{

    button.disabled=false;

    button.textContent="保存";

  }

}


/* =========================
   詳細
========================= */

function detail(id){

  cur=id;

  const s=S.find(
    x=>x.id==id
  );

  if(!s)return;


  $("db").innerHTML=`

    <div class="photo">

      ${
        s.d
        ?
        `<img src="${s.d}">`
        :
        "📸"
      }

    </div>


    <div class="title">

      ${esc(s.name)}

    </div>


    <div class="info">

      <div class="label">
        コース
      </div>

      <div>
        ${esc(cn(s.c))}
      </div>

    </div>


    <div class="info">

      <div class="label">
        使用商材
      </div>

      <div class="memo">

        ${esc(s.ms)||"未入力"}

      </div>

    </div>


    ${
      s.m
      ?
      `
      <div class="info">

        <div class="label">
          商材写真
        </div>

        <div class="photo">

          <img src="${s.m}">

        </div>

      </div>
      `
      :
      ""
    }


    <div class="info">

      <div class="label">
        メモ
      </div>

      <div class="memo">

        ${esc(s.mm)||"なし"}

      </div>

    </div>


    <div class="meta">

      作成：${esc(s.staff||"自分")}
      ・
      ${esc(s.date||"")}

    </div>


    <div class="actions">

      <button
        class="secondary"
        onclick="editS()">

        ✏️ 編集

      </button>

      <button
        class="danger"
        onclick="del()">

        削除

      </button>

    </div>

  `;

  go("detail");

}


/* =========================
   編集
========================= */

function editS(){

  const s=S.find(
    x=>x.id==cur
  );

  if(!s)return;

  co=s.c;

  edit=1;

  $("ft").textContent=
    "サンプルを編集";

  $("fc").textContent=
    "← "+cn(co);

  $("sn").value=s.name;

  $("ms").value=s.ms||"";

  $("mm").value=s.mm||"";

  $("df").value="";

  $("mf").value="";

  $("form").classList.add("open");

}


/* =========================
   削除
========================= */

function del(){

  if(!confirm(
    "このサンプルを削除する？"
  ))return;

  S=S.filter(
    x=>x.id!=cur
  );

  data();

  home();

  list(co);

}


/* =========================
   ボタン
========================= */

$("hp").onclick=chooser;

$("lp").onclick=add;

$("manageAdd").onclick=addCourse;

$("bh").onclick=()=>{

  home();

  go("home");

};

$("bl").onclick=()=>list(co);


/* =========================
   起動
========================= */

home();

</script>

</div>

</body>
</html>
