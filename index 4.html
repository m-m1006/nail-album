<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nail Album</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3f2;color:#302b2a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}header{padding:18px 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}main{padding:16px}h2{font-size:21px}.top,.head{display:flex;justify-content:space-between;align-items:center}.plus{border:0;border-radius:50%;width:44px;height:44px;background:#302b2a;color:#fff;font-size:25px}.more,.back,.secondary{border:0;border-radius:10px;padding:10px;background:#eee9e7;color:#554f4c;font-weight:bold}.course{margin-bottom:28px}.scroll{display:flex;gap:4px;overflow:auto}.thumb{width:112px;min-width:112px;height:112px;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img,.photo img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.grid .thumb{width:auto;min-width:0;height:calc((100vw - 38px)/3);max-height:165px}.photo{width:100%;aspect-ratio:1;background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px}.title{font-size:22px;font-weight:bold;margin:14px 0}.info{border-top:1px solid #eee;padding:14px 0}.label{font-size:12px;color:#999;font-weight:bold}.memo{white-space:pre-wrap;line-height:1.6}.meta{font-size:12px;color:#999}.actions,.row{display:flex;gap:8px;margin-top:14px}.actions>* ,.row>*{flex:1}.primary{border:0;border-radius:10px;padding:12px;background:#302b2a;color:white;font-weight:bold}.danger{border:0;border-radius:10px;padding:12px;background:#f8e5e5;color:#a33;font-weight:bold}.screen{display:none}.active{display:block}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;z-index:10}.open{display:flex}.sheet{background:#fff;width:min(520px,100%);margin:auto;padding:20px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto}.choice{display:block;width:100%;margin:7px 0;text-align:left}label{display:block;margin-top:13px;font-size:13px;font-weight:bold}input,textarea{width:100%;padding:11px;margin-top:5px;border:1px solid #ddd;border-radius:10px;font:inherit}textarea{min-height:100px}.small{font-size:11px;color:#999}.empty{text-align:center;color:#999;padding:30px}
</style><div class="app"><header><b style="font-size:23px">💅 Nail Album</b><div class="small">デザインサンプル共有</div></header><main>
<section id="home" class="screen active"><div class="top"><h2>サンプル</h2><button class="plus" id="hp">＋</button></div><div id="rows"></div></section>
<section id="list" class="screen"><button class="back" id="bh">← ホーム</button><div class="top"><h2 id="lt"></h2><button class="plus" id="lp">＋</button></div><div id="grid" class="grid"></div></section>
<section id="detail" class="screen"><button class="back" id="bl">← 戻る</button><div id="db"></div></section>
</main>
<div id="choose" class="modal"><div class="sheet"><h2>どのコースに追加する？</h2><div id="choices"></div><button class="secondary choice" onclick="closeM('choose')">キャンセル</button></div></div>
<div id="form" class="modal"><div class="sheet"><h2 id="ft">サンプル登録</h2><div class="small" id="fc"></div>
<label>デザイン写真（1枚）</label><input id="df" type="file" accept="image/*"><label>商材写真（1枚）</label><input id="mf" type="file" accept="image/*">
<label>サンプル名</label><input id="sn"><label>使用商材</label><textarea id="ms" placeholder="使った商材をまとめて入力"></textarea><label>メモ</label><textarea id="mm" placeholder="使用量・塗り方・注意点など"></textarea>
<div class="row"><button class="secondary" onclick="closeM('form')">キャンセル</button><button class="primary" onclick="save()">保存</button></div></div></div>
<script>
const C=[["シンプル",1],["こだわり",2],["フルオーダー",3]],$=x=>document.getElementById(x);let S=JSON.parse(localStorage.getItem("na")||"[]"),co=1,cur=0,edit=0;
function data(){localStorage.setItem("na",JSON.stringify(S))}function cn(id){return C.find(x=>x[1]==id)[0]}function esc(x){return String(x||"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[a]))}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");scrollTo(0,0)}
function th(s){return `<div class="thumb" onclick="detail(${s.id})">${s.d?`<img src="${s.d}">`:"📸"}</div>`}
function home(){$("rows").innerHTML=C.map(c=>{let a=S.filter(s=>s.c==c[1]).sort((x,y)=>y.t-x.t).slice(0,5);return `<div class="course"><div class="head"><b>${c[0]}</b><button class="more" onclick="list(${c[1]})">すべて見る →</button></div><div class="scroll">${a.length?a.map(th).join(""):`<div class="empty" style="width:100%">まだサンプルがありません</div>`}</div></div>`}).join("")}
function list(id){co=id;$("lt").textContent=cn(co);let a=S.filter(s=>s.c==co).sort((x,y)=>y.t-x.t);$("grid").innerHTML=a.length?a.map(th).join(""):`<div class="empty" style="grid-column:1/-1">まだサンプルがありません</div>`;go("list")}
function chooser(){$("choices").innerHTML=C.map(c=>`<button class="secondary choice" onclick="pick(${c[1]})">${c[0]}</button>`).join("");$("choose").classList.add("open")}
function pick(id){co=id;closeM("choose");add()}
function add(){edit=0;cur=0;$("ft").textContent="サンプル登録";$("fc").textContent="← "+cn(co);let n=S.filter(s=>s.c==co).map(s=>+(s.name.match(/(\d+)$/)||[0,0])[1]);$("sn").value=cn(co)+(Math.max(0,...n)+1);$("ms").value="";$("mm").value="";$("df").value="";$("mf").value="";$("form").classList.add("open")}
function file(f){return new Promise(r=>{if(!f)return r("");let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
async function save(){let name=$("sn").value.trim(),d=await file($("df").files[0]),m=await file($("mf").files[0]);if(!name||(!d&&!edit)){alert("サンプル名とデザイン写真を入れてね");return}if(edit){let s=S.find(x=>x.id==cur);s.name=name;s.ms=$("ms").value;s.mm=$("mm").value;if(d)s.d=d;if(m)s.m=m}else S.push({id:Date.now(),c:co,name,d,m,ms:$("ms").value,mm:$("mm").value,staff:"自分",date:new Date().toLocaleDateString("ja-JP"),t:Date.now()});data();closeM("form");list(co)}
function detail(id){cur=id;let s=S.find(x=>x.id==id);$("db").innerHTML=`<div class="photo">${s.d?`<img src="${s.d}" onclick="window.open(this.src)">`:"📸"}</div><div class="title">${esc(s.name)}</div><div class="info"><div class="label">使用商材</div><div class="memo">${esc(s.ms)||"未入力"}</div></div>${s.m?`<div class="info"><div class="label">商材写真</div><div class="photo"><img src="${s.m}" onclick="window.open(this.src)"></div></div>`:""}<div class="info"><div class="label">メモ</div><div class="memo">${esc(s.mm)||"なし"}</div></div><div class="meta">作成：${s.staff} ・ ${s.date}</div><div class="actions"><button class="secondary" onclick="editS()">✏️ 編集</button><button class="danger" onclick="del()">削除</button></div>`;go("detail")}
function editS(){let s=S.find(x=>x.id==cur);co=s.c;edit=1;$("ft").textContent="サンプルを編集";$("fc").textContent="← "+cn(co);$("sn").value=s.name;$("ms").value=s.ms;$("mm").value=s.mm;$("df").value="";$("mf").value="";$("form").classList.add("open")}
function del(){if(confirm("このサンプルを削除する？")){S=S.filter(x=>x.id!=cur);data();list(co)}}
function closeM(id){$(id).classList.remove("open")}
$("hp").onclick=chooser;$("lp").onclick=add;$("bh").onclick=()=>{home();go("home")};$("bl").onclick=()=>list(co);home();
</script></div>
